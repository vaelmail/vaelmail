<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="330">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <linearGradient id="titleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#0f1724"/>
    </linearGradient>

    <style>
      .term-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
        font-size: 13px;
        letter-spacing: 0.3px;
      }
      
      @keyframes typeLine1 { 0%, 5% { opacity: 0; } 8%, 100% { opacity: 1; } }
      @keyframes typeLine2 { 0%, 15% { opacity: 0; } 18%, 100% { opacity: 1; } }
      @keyframes typeLine3 { 0%, 25% { opacity: 0; } 28%, 100% { opacity: 1; } }
      @keyframes typeLine4 { 0%, 35% { opacity: 0; } 38%, 100% { opacity: 1; } }
      @keyframes typeLine5 { 0%, 45% { opacity: 0; } 48%, 100% { opacity: 1; } }
      @keyframes typeLine6 { 0%, 55% { opacity: 0; } 58%, 100% { opacity: 1; } }
      @keyframes typeLine7 { 0%, 65% { opacity: 0; } 68%, 100% { opacity: 1; } }
      @keyframes typeLine8 { 0%, 75% { opacity: 0; } 78%, 100% { opacity: 1; } }
      @keyframes typeLine9 { 0%, 85% { opacity: 0; } 88%, 100% { opacity: 1; } }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .line1 { animation: typeLine1 12s infinite; }
      .line2 { animation: typeLine2 12s infinite; }
      .line3 { animation: typeLine3 12s infinite; }
      .line4 { animation: typeLine4 12s infinite; }
      .line5 { animation: typeLine5 12s infinite; }
      .line6 { animation: typeLine6 12s infinite; }
      .line7 { animation: typeLine7 12s infinite; }
      .line8 { animation: typeLine8 12s infinite; }
      .line9 { animation: typeLine9 12s infinite; }
      .cursor { animation: blink 1s infinite; }
    </style>
  </defs>

  <!-- Terminal Window Shell -->
  <rect x="2" y="2" width="836" height="326" rx="10" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 2 12 C 2 6.5 6.5 2 12 2 L 828 2 C 833.5 2 838 6.5 838 12 L 838 34 L 2 34 Z" fill="url(#titleBar)"/>
  <line x1="2" y1="34" x2="838" y2="34" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="20" cy="18" r="5.5" fill="#ef4444"/>
  <circle cx="38" cy="18" r="5.5" fill="#f59e0b"/>
  <circle cx="56" cy="18" r="5.5" fill="#10b981"/>

  <!-- Window Title -->
  <text class="term-text" x="420" y="22" fill="#94a3b8" font-size="11" text-anchor="middle" font-weight="500">
    guest@vaelmail-station: ~ (auth-session)
  </text>

  <!-- Terminal Body Content -->
  <g transform="translate(24, 46)">
    <!-- Command Prompt -->
    <g class="line1" transform="translate(0, 22)">
      <text class="term-text" x="0" y="0" fill="#00e599">guest@station:~$</text>
      <text class="term-text" x="145" y="0" fill="#f1f5f9" font-weight="600">vaelmail session-init --zero-kyc</text>
    </g>

    <!-- Derivation output -->
    <g class="line2" transform="translate(0, 48)">
      <text class="term-text" x="0" y="0" fill="#64748b">[INFO]</text>
      <text class="term-text" x="60" y="0" fill="#94a3b8">Deriving 16-digit deterministic credential...</text>
    </g>

    <!-- Master Key -->
    <g class="line3" transform="translate(0, 74)">
      <text class="term-text" x="0" y="0" fill="#00e599">[KEY]</text>
      <text class="term-text" x="60" y="0" fill="#e2e8f0">Master Account Key: </text>
      <text class="term-text" x="220" y="0" fill="#00e599" font-weight="700" letter-spacing="1">8492 0184 7291 9302</text>
      <text class="term-text" x="410" y="0" fill="#64748b">(Store this offline)</text>
    </g>

    <!-- Cryptographic Primitive -->
    <g class="line4" transform="translate(0, 100)">
      <text class="term-text" x="0" y="0" fill="#38bdf8">[HASH]</text>
      <text class="term-text" x="60" y="0" fill="#94a3b8">Key Derivation Function: </text>
      <text class="term-text" x="255" y="0" fill="#38bdf8" font-weight="600">Argon2id (m=64MB, t=3, p=4)</text>
    </g>

    <!-- Mailbox Allocation -->
    <g class="line5" transform="translate(0, 126)">
      <text class="term-text" x="0" y="0" fill="#a78bfa">[HOST]</text>
      <text class="term-text" x="60" y="0" fill="#cbd5e1">Maildir Storage: </text>
      <text class="term-text" x="195" y="0" fill="#a78bfa" font-weight="600">50 MB receive-only mailbox allocated</text>
      <text class="term-text" x="495" y="0" fill="#64748b">| Sweden &#x1F1F8;&#x1F1EA;</text>
    </g>

    <!-- Permanent Aliases -->
    <g class="line6" transform="translate(0, 152)">
      <text class="term-text" x="0" y="0" fill="#f59e0b">[ALIAS]</text>
      <text class="term-text" x="60" y="0" fill="#e2e8f0">Subaddressed Aliases: </text>
      <text class="term-text" x="235" y="0" fill="#f59e0b" font-weight="600">shadow@vael.pw, git@vael.pw</text>
      <text class="term-text" x="465" y="0" fill="#64748b">&rarr; Inbox routing</text>
    </g>

    <!-- Ingress Routes -->
    <g class="line7" transform="translate(0, 178)">
      <text class="term-text" x="0" y="0" fill="#34d399">[ROUTE]</text>
      <text class="term-text" x="60" y="0" fill="#94a3b8">Ingress: </text>
      <text class="term-text" x="135" y="0" fill="#38bdf8">HTTPS</text>
      <text class="term-text" x="180" y="0" fill="#64748b">|</text>
      <text class="term-text" x="195" y="0" fill="#c084fc">Tor v3 (.onion)</text>
      <text class="term-text" x="325" y="0" fill="#64748b">|</text>
      <text class="term-text" x="340" y="0" fill="#f43f5e">No-JS Mirror (nojs.vaelmail.com)</text>
    </g>

    <!-- Security Ready -->
    <g class="line8" transform="translate(0, 204)">
      <text class="term-text" x="0" y="0" fill="#00e599">[STATUS]</text>
      <text class="term-text" x="60" y="0" fill="#00e599" font-weight="600">Ready. Zero phone numbers collected. Zero telemetry.</text>
    </g>

    <!-- New Prompt Line -->
    <g class="line9" transform="translate(0, 238)">
      <text class="term-text" x="0" y="0" fill="#00e599">guest@station:~$</text>
      <text class="term-text cursor" x="145" y="0" fill="#00e599">&#x2588;</text>
    </g>
  </g>
</svg>
