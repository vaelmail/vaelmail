<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="50%" stop-color="#0b1320"/>
      <stop offset="100%" stop-color="#050c18"/>
    </linearGradient>
    
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e599"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e599"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101929" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1424" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132338" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes borderGlow {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; }
      }
      .pulsing-dot {
        transform-origin: 48px 42px;
        animation: pulseDot 2s infinite ease-in-out;
      }
      .banner-border {
        animation: borderGlow 4s infinite ease-in-out;
      }
      .mono-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Base Card -->
  <rect x="2" y="2" width="896" height="256" rx="14" fill="url(#bgGradient)"/>
  <rect x="2" y="2" width="896" height="256" rx="14" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect class="banner-border" x="2" y="2" width="896" height="256" rx="14" fill="none" stroke="url(#neonGradient)" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Top Status Bar -->
  <g transform="translate(0, 0)">
    <!-- Status Indicator Dot -->
    <circle class="pulsing-dot" cx="48" cy="42" r="5" fill="#00e599" filter="url(#pulseGlow)"/>
    <text class="mono-text" x="62" y="46" fill="#00e599" font-size="11" font-weight="600" letter-spacing="1.5">NETWORK ONLINE</text>
    <text class="mono-text" x="210" y="46" fill="#64748b" font-size="11">|</text>
    <text class="mono-text" x="225" y="46" fill="#94a3b8" font-size="11">SERVER: 217.60.78.29</text>
    <text class="mono-text" x="390" y="46" fill="#64748b" font-size="11">|</text>
    <text class="mono-text" x="405" y="46" fill="#38bdf8" font-size="11">STOCKHOLM, SWEDEN &#x1F1F8;&#x1F1EA;</text>

    <!-- Version Tag -->
    <rect x="760" y="30" width="94" height="22" rx="11" fill="#101d2e" stroke="#1e293b" stroke-width="1"/>
    <text class="mono-text" x="807" y="45" fill="#a5b4fc" font-size="10.5" font-weight="600" text-anchor="middle">v2.4 ACTIVE</text>
  </g>

  <!-- Shield Icon Monogram -->
  <g transform="translate(48, 80)">
    <!-- Outer Shield Glow -->
    <path d="M 36 4 L 68 16 C 68 50 52 74 36 84 C 20 74 4 50 4 16 Z" fill="#0a1b2a" stroke="url(#shieldGrad)" stroke-width="2.5" filter="url(#glow)" opacity="0.3"/>
    <!-- Inner Shield -->
    <path d="M 36 4 L 68 16 C 68 50 52 74 36 84 C 20 74 4 50 4 16 Z" fill="#06121e" stroke="url(#shieldGrad)" stroke-width="2.5"/>
    <!-- Lock / Keyhole / Monogram V -->
    <path d="M 22 28 L 36 62 L 50 28" fill="none" stroke="#00e599" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="36" cy="26" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Main Headline Typography -->
  <g transform="translate(142, 106)">
    <text class="sans-text" x="0" y="16" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="1">VAELMAIL</text>
    <text class="mono-text" x="186" y="13" fill="#00e599" font-size="14" font-weight="600" letter-spacing="2">/ PRIVATE WEBMAIL</text>
    <text class="sans-text" x="0" y="42" fill="#94a3b8" font-size="14" font-weight="400">
      Deterministic 16-digit account keys with zero phone verification and persistent aliases.
    </text>
  </g>

  <!-- Bottom Capability Badges / Pills -->
  <g transform="translate(48, 192)">
    <!-- Pill 1: 16-Digit Keys -->
    <rect x="0" y="0" width="186" height="38" rx="8" fill="url(#pillBg)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="19" r="4" fill="#00e599"/>
    <text class="mono-text" x="34" y="16" fill="#f1f5f9" font-size="11.5" font-weight="600">16-Digit Account Keys</text>
    <text class="sans-text" x="34" y="29" fill="#64748b" font-size="9.5">Mullvad-style Auth</text>

    <!-- Pill 2: Zero Phone/KYC -->
    <rect x="200" y="0" width="186" height="38" rx="8" fill="url(#pillBg)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="220" cy="19" r="4" fill="#38bdf8"/>
    <text class="mono-text" x="234" y="16" fill="#f1f5f9" font-size="11.5" font-weight="600">Zero Phone Verification</text>
    <text class="sans-text" x="234" y="29" fill="#64748b" font-size="9.5">No SMS or Telecom link</text>

    <!-- Pill 3: Tor v3 & No-JS -->
    <rect x="400" y="0" width="194" height="38" rx="8" fill="url(#pillBg)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="420" cy="19" r="4" fill="#c084fc"/>
    <text class="mono-text" x="434" y="16" fill="#f1f5f9" font-size="11.5" font-weight="600">Tor v3 &amp; No-JS Mirror</text>
    <text class="sans-text" x="434" y="29" fill="#64748b" font-size="9.5">Scriptless &amp; Onion Ingress</text>

    <!-- Pill 4: Sweden Datacenter -->
    <rect x="608" y="0" width="196" height="38" rx="8" fill="url(#pillBg)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="628" cy="19" r="4" fill="#f59e0b"/>
    <text class="mono-text" x="642" y="16" fill="#f1f5f9" font-size="11.5" font-weight="600">Sweden Jurisdiction &#x1F1F8;&#x1F1EA;</text>
    <text class="sans-text" x="642" y="29" fill="#64748b" font-size="9.5">AES-256 Maildir Storage</text>
  </g>
</svg>
